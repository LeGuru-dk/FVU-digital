name: Generer materialeliste

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-materials:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Opsæt Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generér materialeliste
        run: python scripts/generate-materials.py

      - name: Commit opdateret JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatisk opdatering af materialer.json"