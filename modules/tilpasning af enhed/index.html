:root{--blue:#174a7e;--light:#eef5fb;--ink:#1d2733;--ok:#0f6b4b;--border:#cbd8e5}*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;color:var(--ink);background:#f6f8fa;line-height:1.55}header{background:linear-gradient(135deg,#123f6b,#246aa4);color:white;padding:2.2rem 1rem}header>div,main{max-width:1100px;margin:auto}h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 .5rem}header p{font-size:1.15rem;max-width:760px;margin:.3rem 0}.toolbar{background:white;border:1px solid var(--border);border-radius:16px;padding:1rem;margin:-1.3rem 0 1.3rem;position:relative;box-shadow:0 6px 20px #17355018}.platforms,.cats{display:flex;gap:.55rem;flex-wrap:wrap;margin:.7rem 0}button,input{font:inherit}button{min-height:48px;border:2px solid var(--blue);border-radius:12px;background:white;color:var(--blue);font-weight:700;padding:.65rem .9rem;cursor:pointer}button.active,button:hover{background:var(--blue);color:white}button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid #ffbf47;outline-offset:2px}input{width:100%;min-height:52px;border:2px solid #8196aa;border-radius:12px;padding:.7rem 1rem;font-size:1.08rem}.actions{display:flex;justify-content:space-between;gap:.5rem;align-items:center;flex-wrap:wrap}.count{font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;padding-bottom:3rem}details{background:white;border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px #16324d0d}summary{cursor:pointer;padding:1rem;min-height:74px;display:flex;flex-direction:column;justify-content:center;font-weight:700;font-size:1.08rem}.tag{font-size:.78rem;color:var(--blue);font-weight:700;letter-spacing:.02em;margin-bottom:.2rem}.content{border-top:1px solid var(--border);padding:1rem}.steps{background:var(--light);border-left:5px solid var(--blue);padding:.9rem;border-radius:8px}.note{margin-top:.8rem;padding:.8rem;border-left:5px solid var(--ok);background:#edf8f3}.empty{grid </style></head><body><header><div><h1>Gør din enhed lettere at bruge</h1><p>Find det problem, du oplever. Du behøver ikke kende navnet på funktionen. Vælg enhed, søg og følg vejledningen i dit eget tempo.</p></div></header><main><section class="toolbar" aria-label="Søg og filtre"><label for="search"><strong>Hvad har du svært ved?</strong></label><input id="search" type="search" placeholder="Søg fx tekst, mus, lyd, zoom eller beskeder"><div class="platforms" aria-label="Vælg enhed"></div><div class="cats" aria-label="Vælg emne"></div><div class="actions"><span class="count" aria-live="polite"></span><button id="size" type="button">A+ Større tekst</button></div></section><section id="list" class="grid" aria-label="Vejledninger"></section></main><footer>FVU-Digital • Opslagsværk til kursister • Menunavne kan variere efter version og enhedsmodel.</footer><script>
const data=[{"platform": "Windows 11", "category": "Syn og skærm", "title": "Teksten er for lille", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Tekststørrelse. Flyt skyderen, til prøveteksten er let at læse, og vælg Anvend.", "note": "Det ændrer tekststørrelsen, men ikke nødvendigvis alle knapper og billeder."}, {"platform": "Windows 11", "category": "Syn og skærm", "title": "Alt på skærmen er for småt", "steps": "Åbn Start > Indstillinger > System > Skærm. Find Skala, og vælg en større procent, fx 125 % eller 150 %.", "note": "Vælg helst en af de anbefalede værdier."}, {"platform": "Windows 11", "category": "Syn og skærm", "title": "Jeg vil forstørre midlertidigt", "steps": "Tryk på Windows-tast + plus (+) for at åbne Forstørrelsesglas. Brug Windows-tast + plus/minus til at ændre forstørrelsen. Luk med Windows-tast + Esc.", "note": "Prøv funktionen på en hjemmeside eller i et dokument."}, {"platform": "Windows 11", "category": "Syn og skærm", "title": "Musemarkøren er svær at finde", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Musemarkør og berøring. Gør markøren større, og vælg eventuelt en tydelig farve.", "note": "En farvet markør kan være lettere at finde end en hvid."}, {"platform": "Windows 11", "category": "Syn og skærm", "title": "Tekstmarkøren er svær at se", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Tekstmarkør. Slå tekstmarkørindikatoren til, og vælg størrelse og farve.", "note": "Tekstmarkøren er den lodrette streg, der viser, hvor du skriver."}, {"platform": "Windows 11", "category": "Syn og skærm", "title": "Jeg har brug for mere kontrast", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Kontrasttemaer. Vælg et tema, se eksemplet, og vælg Anvend.", "note": "Du kan altid vælge Ingen for at vende tilbage."}, {"platform": "Windows 11", "category": "Syn og skærm", "title": "Farver er svære at skelne", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Farvefiltre. Slå filtre til, og afprøv den type, der hjælper bedst.", "note": "Vurder resultatet på både billeder og tekst."}, {"platform": "Windows 11", "category": "Ro og overblik", "title": "Animationer og gennemsigtighed forstyrrer", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Visuelle effekter. Slå Animationseffekter og Gennemsigtighedseffekter fra.", "note": "Det kan gøre skærmen roligere."}, {"platform": "Windows 11", "category": "Mus og touchpad", "title": "Musen bevæger sig for hurtigt", "steps": "Åbn Start > Indstillinger > Bluetooth og enheder > Mus. Juster markørhastigheden lidt ad gangen.", "note": "Test ved at ramme en mindre knap uden at skynde dig."}, {"platform": "Windows 11", "category": "Mus og touchpad", "title": "Jeg bruger venstre hånd til musen", "steps": "Åbn Start > Indstillinger > Bluetooth og enheder > Mus. Skift Primær museknap til Højre.", "note": "Du kan ændre den tilbage samme sted."}, {"platform": "Windows 11", "category": "Tastatur og hænder", "title": "Jeg rammer den samme tast flere gange", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Tastatur. Slå Filtertaster til, og afprøv indstillingerne.", "note": "Justér forsigtigt, så tastaturet stadig reagerer naturligt."}, {"platform": "Windows 11", "category": "Tastatur og hænder", "title": "Det er svært at holde flere taster nede", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Tastatur. Slå Træge taster til. Nu kan genvejstaster trykkes én ad gangen.", "note": "Prøv fx Ctrl og derefter C."}, {"platform": "Windows 11", "category": "Tastatur og hænder", "title": "Jeg vil bruge et tastatur på skærmen", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Tastatur. Slå Skærmtastatur til.", "note": "Du kan skrive ved at klikke eller trykke på tasterne."}, {"platform": "Windows 11", "category": "Hørelse og lyd", "title": "Jeg hører bedst med ét øre", "steps": "Åbn Start > Indstillinger > Tilgængelighed > Lyd. Slå Monolyd til.", "note": "Monolyd samler venstre og højre lydkanal."}, {"platform": "Windows 11", "category": k ved en fejl", "steps": "Åbn Indstillinger > Tilgængelighed, og søg efter Tryk og hold-forsinkelse. Vælg en længere tid.", "note": "Test med et appikon, før du beslutter dig."}, {"platform": "Android mobil/tablet", "category": "Ro og overblik", "title": "Bevægelser på skærmen generer mig", "steps": "Åbn Indstillinger > Tilgængelighed > Farve og bevægelse, og slå Fjern animationer til, hvis funktionen findes.", "note": "Nogle apps styrer deres egne animationer."}, {"platform": "Android mobil/tablet", "category": "Ro og overblik", "title": "Jeg vil bruge telefonen med én hånd", "steps": "Åbn Indstillinger, og søg efter Enhåndstilstand. Slå funktionen til, og følg demonstrationen på skærmen.", "note": "Findes og aktiveres forskelligt på forskellige mærker."}, {"platform": "iPhone/iPad", "category": "Syn og skærm", "title": "Teksten er for lille", "steps": "Åbn Indstillinger > Tilgængelighed > Skærm & tekststørrelse > Større tekst. Flyt skyderen, og slå eventuelt Større tilgængelighedsstørrelser til.", "note": "Nogle apps følger ikke alle tekststørrelser."}, {"platform": "iPhone/iPad", "category": "Syn og skærm", "title": "Jeg vil zoome på hele skærmen", "steps": "Åbn Indstillinger > Tilgængelighed > Zoom, og slå Zoom til. Følg bevægelsesvejledningen på skærmen.", "note": "Zoom bruger særlige flerfingerbevægelser. Start gerne sammen med en hjælper."}, {"platform": "iPhone/iPad", "category": "Syn og skærm", "title": "Jeg har brug for tydeligere tekst og knapper", "steps": "Åbn Indstillinger > Tilgængelighed > Skærm & tekststørrelse. Afprøv Fed tekst, Forøg kontrast og Reducer gennemsigtighed.", "note": "Slå én ting til ad gangen, så du kan mærke forskellen."}, {"platform": "iPhone/iPad", "category": "Syn og skærm", "title": "Farver er svære at skelne", "steps": "Åbn Indstillinger > Tilgængelighed > Skærm & tekststørrelse > Farvefiltre. Slå funktionen til, og vælg filter.", "note": "Brug skyderen til at tilpasse styrken."}, {"platform": "iPhone/iPad", "category": "Syn og skærm", "title": "Jeg vil bruge enheden som lup", "steps": "Åbn appen Forstørrelsesglas. Hvis den ikke ses, søg efter den fra hjemmeskærmen eller tilføj den i Kontrolcenter.", "note": "Brug zoom, lys og filtre til små tekster i omgivelserne."}, {"platform": "iPhone/iPad", "category": "Tale og oplæsning", "title": "Jeg vil høre tekst læst højt", "steps": "Åbn Indstillinger > Tilgængelighed > Oplæst indhold. Slå Læs markering op eller Læs skærm op til.", "note": "Når Læs skærm op er aktiv, kan du stryge ned med to fingre fra toppen."}, {"platform": "iPhone/iPad", "category": "Tale og oplæsning", "title": "Jeg vil have hele skærmen læst op", "steps": "Åbn Indstillinger > Tilgængelighed > VoiceOver. Læs vejledningen, før du slår funktionen til.", "note": "VoiceOver ændrer alle berøringsbevægelser. Brug øveområdet eller få hjælp første gang."}, {"platform": "iPhone/iPad", "category": "Berøring og betjening", "title": "Fysiske knapper er svære at bruge", "steps": "Åbn Indstillinger > Tilgængelighed > Berøring > AssistiveTouch. Slå funktionen til.", "note": "Der vises en flytbar knap med adgang til blandt andet lydstyrke, lås og skærmbillede."}, {"platform": "iPhone/iPad", "category": "Berøring og betjening", "title": "Skærmen reagerer for hurtigt eller forkert", "steps": "Åbn Indstillinger > Tilgængelighed > Berøring > Tilpasning af berøring. Læs mulighederne, og ændr kun én indstilling ad gangen.", "note": "Forkerte indstillinger kan gøre enheden svær at betjene. Få gerne hjælp."}, {"platform": "iPhone/iPad", "category": "Hørelse og lyd", "title": "Jeg hører bedst med ét øre", "steps": "Åbn Indstillinger > Tilgængelighed > Lyd & visuel. Slå Monolyd til, og juster balancen, hvis det er nødvendigt.", "note": "Sæt balancen tilbage i midten, hvis begge ører bruges."}, {"platform": "iPhone/iPad", "category": "Hørelse og lyd", "title": "Jeg vil se et blink ved beskeder", "steps": "Åbn Indstillinger > Tilgængelighed > Lyd & visuel > LED-blink ved advarsler. Slå funktionen til.", "note": "Blinket ses tydeligst, når enheden ligger med skærmen nedad."}, {"platform": "iPhone/iPad", "category": "Ro og overblik", "title": "Bevægelser på skærmen generer mig", "steps": "Åbn Indstillinger > Tilgængelighed > Bevægelse. Slå Reducer bevægelse til, og begræns eventuelt automatisk afspilning.", "note": "Det kan give et roligere skift mellem skærmbilleder."}]; let platform='Alle',cat='Alle'; const $=s=>document.querySelector(s); const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const platforms=['Alle',...new Set(data.map(x=>x.platform))]; const cats=['Alle',...new Set(data.map(x=>x.category))];
function buttons(where,arr,type){$(where).innerHTML=arr.map(x=>`<button type="button" data-${type}="${esc(x)}" class="${x==='Alle'?'active':''}">${esc(x)}</button>`).join('')}
buttons('.platforms',platforms,'platform');buttons('.cats',cats,'cat');
document.addEventListener('click',e=>{let b=e.target.closest('button[data-platform],button[data-cat]');if(!b)return;if(b.dataset.platform){platform=b.dataset.platform;document.querySelectorAll('[data-platform]').forEach(x=>x.classList.toggle('active',x===b))}else{cat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b))}render()});
$('#search').addEventListener('input',render);$('#size').addEventListener('click',()=>{document.body.classList.toggle('big');$('#size').textContent=document.body.classList.contains('big')?'A− Normal tekst':'A+ Større tekst'});
function render(){const q=$('#search').value.trim().toLocaleLowerCase('da');const rows=data.filter(x=>(platform==='Alle'||x.platform===platform)&&(cat==='Alle'||x.category===cat)&&(!q||Object.values(x).join(' ').toLocaleLowerCase('da').includes(q)));$('.count').textContent=`${rows.length} vejledning${rows.length===1?'':'er'} vises`;$('#list').innerHTML=rows.length?rows.map((x,i)=>`<details><summary><span class="tag">${esc(x.platform)} • ${esc(x.category)}</span>${esc(x.title)}</summary><div class="content"><div class="steps"><strong>Sådan gør du</strong><br>${esc(x.steps)}</div><div class="note"><strong>Husk</strong><br>${esc(x.note)}</div></div></details>`).join(''):`<div class="empty"><h2>Ingen vejledninger fundet</h2><p>Prøv et kortere søgeord, fx <strong>tekst</strong>, <strong>lyd</strong> eller <strong>zoom</strong>.</p></div>`}render();
