<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lær at klikke</title><style>
:root{--navy:#17324d;--blue:#246b8f;--sky:#eaf5fa;--green:#287a56;--red:#a43b3b;--yellow:#f4c95d;--line:#cddde5;--shadow:0 12px 30px rgba(23,50,77,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;color:var(--navy);background:linear-gradient(145deg,#edf7fb,#fffaf0);min-height:100vh}button,input{font:inherit}.page{width:min(980px,calc(100% - 28px));margin:auto;padding:24px 0 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back{color:var(--navy);text-decoration:none;font-weight:700}.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;color:var(--navy);cursor:pointer}.hero,.card{background:rgba(255,255,255,.95);border:1px solid #dce9ef;border-radius:20px;box-shadow:var(--shadow)}.hero{padding:24px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:18px}.icon{width:76px;height:76px;border-radius:18px;background:var(--sky);display:grid;place-items:center;font-size:40px}h1{font-size:clamp(1.8rem,5vw,2.55rem);margin:0 0 7px}.hero p{font-size:1.07rem;line-height:1.5;margin:0}.card{padding:clamp(18px,4vw,32px)}.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:18px}.stat{min-width:130px;background:#f6fafc;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat strong{display:block;font-size:1.3rem}.instructions{text-align:center;margin:0 0 18px;line-height:1.5}.feedback{min-height:38px;text-align:center;font-size:1.08rem;font-weight:700;margin:14px 0 0}.ok{color:var(--green)}.help{color:var(--red)}.primary{border:0;border-radius:13px;background:var(--navy);color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.secondary{border:2px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);padding:10px 16px;font-weight:800;cursor:pointer}.tip{margin-top:20px;padding:15px 17px;background:#fff8df;border-left:6px solid var(--yellow);border-radius:12px;line-height:1.5}.progress{height:12px;background:#e5edf1;border-radius:999px;overflow:hidden;margin-bottom:22px}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .25s}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
@media(max-width:650px){.hero{grid-template-columns:1fr;text-align:center}.icon{margin:auto}.stat{min-width:calc(50% - 10px)}}
</style></head><body><main class="page"><nav class="top"><a class="back" href="../index.html">← Tilbage til øvelserne</a><button class="pill" id="sound" type="button" aria-pressed="true">🔊 Lyd til</button></nav><section class="hero"><div class="icon" aria-hidden="true">🖱️</div><div><h1>Lær at klikke</h1><p>Træn enkeltklik og højreklik på mapper, filer og knapper, som ligner dem, du møder på en computer.</p></div></section><section class="card"><div class="stats"><div class="stat"><span>Trin</span><strong id="step">1 af 4</strong></div><div class="stat"><span>Rigtige</span><strong id="score">0</strong></div></div><div class="progress"><div id="bar" style="width:0"></div></div><p class="instructions" id="task">Klik én gang på mappen <strong>Dokumenter</strong>.</p><div id="desktop" class="desktop" aria-label="Øvelsesområde"></div><p id="feedback" class="feedback" aria-live="polite"></p><div class="actions"><button class="secondary" id="restart">Start forfra</button></div><div class="tip"><strong>Tip:</strong> Brug et roligt, enkelt klik. Du skal ikke skynde dig.</div><style>.desktop{min-height:330px;background:#eaf4f8;border:3px solid var(--line);border-radius:18px;padding:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-content:start}.item{border:3px solid transparent;background:transparent;border-radius:14px;padding:12px 6px;color:var(--navy);cursor:pointer;text-align:center;font-weight:700}.item:hover,.item:focus{background:#fff;border-color:var(--blue);outline:0}.item .emoji{display:block;font-size:52px;margin-bottom:6px}.selected{background:#dbeef7!important;border-color:var(--blue)!important}.target{outline:4px dashed var(--yellow)}@media(max-width:520px){.desktop{grid-template-columns:repeat(2,1fr)}}</style></section></main><script>
let soundOn=true;const snd=document.querySelector('#sound');snd.addEventListener('click',()=>{soundOn=!soundOn;snd.textContent=soundOn?'🔊 Lyd til':'🔇 Lyd fra';snd.setAttribute('aria-pressed',soundOn)});function tone(f=520){if(!soundOn)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);o.stop(c.currentTime+.09)}catch(e){}}

const desk=document.querySelector('#desktop'),task=document.querySelector('#task'),feedback=document.querySelector('#feedback'),bar=document.querySelector('#bar');let step=0,score=0;const items=[['Dokumenter','📁'],['Billeder','📁'],['PDF-filen','📄'],['Opskrifter','📄'],['Indstillinger','⚙️'],['Papirkurv','🗑️']];const tasks=[{text:'Klik én gang på mappen <strong>Dokumenter</strong>.',name:'Dokumenter',kind:'click'},{text:'Klik én gang på filen <strong>PDF-filen</strong>.',name:'PDF-filen',kind:'click'},{text:'Højreklik på mappen <strong>Billeder</strong>.',name:'Billeder',kind:'contextmenu'},{text:'Klik én gang på <strong>Indstillinger</strong>.',name:'Indstillinger',kind:'click'}];function render(){desk.innerHTML='';items.forEach(([n,e])=>{const b=document.createElement('button');b.className='item';b.dataset.name=n;b.innerHTML=`<span class="emoji">${e}</span>${n}`;b.addEventListener('click',ev=>check(ev,'click'));b.addEventListener('contextmenu',ev=>{ev.preventDefault();check(ev,'contextmenu')});desk.appendChild(b)});task.innerHTML=tasks[step].text;document.querySelector('#step').textContent=`${step+1} af 4`;bar.style.width=`${step*25}%`}function check(e,k){const t=tasks[step];if(e.currentTarget.dataset.name===t.name&&k===t.kind){score++;tone();feedback.textContent='Rigtigt. Godt klaret!';feedback.className='feedback ok';e.currentTarget.classList.add('selected');step++;document.querySelector('#score').textContent=score;bar.style.width=`${step*25}%`;setTimeout(()=>{if(step<tasks.length)render();else{task.innerHTML='<strong>Du har gennemført øvelsen.</strong>';desk.innerHTML='<div style="grid-column:1/-1;text-align:center;font-size:4rem;padding:60px">✅</div>';feedback.textContent='Flot! Du har trænet enkeltklik og højreklik.'}},550)}else{tone(220);feedback.textContent=k==='contextmenu'?'Prøv igen. Var det et højreklik?':'Prøv igen. Læs opgaven én gang til.';feedback.className='feedback help'}}document.querySelector('#restart').onclick=()=>{step=score=0;document.querySelector('#score').textContent=0;feedback.textContent='';render()};render();</script></body></html>
