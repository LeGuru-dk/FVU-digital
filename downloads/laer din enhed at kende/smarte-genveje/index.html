<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smarte genveje</title><style>
:root{--navy:#17324d;--blue:#246b8f;--sky:#eaf5fa;--green:#287a56;--red:#a43b3b;--yellow:#f4c95d;--line:#cddde5;--shadow:0 12px 30px rgba(23,50,77,.12)}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Segoe UI",sans-serif;color:var(--navy);background:linear-gradient(145deg,#edf7fb,#fffaf0);min-height:100vh}button,input{font:inherit}.page{width:min(980px,calc(100% - 28px));margin:auto;padding:24px 0 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.back{color:var(--navy);text-decoration:none;font-weight:700}.pill{border:2px solid var(--line);background:#fff;border-radius:999px;padding:10px 15px;font-weight:700;color:var(--navy);cursor:pointer}.hero,.card{background:rgba(255,255,255,.95);border:1px solid #dce9ef;border-radius:20px;box-shadow:var(--shadow)}.hero{padding:24px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:18px}.icon{width:76px;height:76px;border-radius:18px;background:var(--sky);display:grid;place-items:center;font-size:40px}h1{font-size:clamp(1.8rem,5vw,2.55rem);margin:0 0 7px}.hero p{font-size:1.07rem;line-height:1.5;margin:0}.card{padding:clamp(18px,4vw,32px)}.stats{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-bottom:18px}.stat{min-width:130px;background:#f6fafc;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat strong{display:block;font-size:1.3rem}.instructions{text-align:center;margin:0 0 18px;line-height:1.5}.feedback{min-height:38px;text-align:center;font-size:1.08rem;font-weight:700;margin:14px 0 0}.ok{color:var(--green)}.help{color:var(--red)}.primary{border:0;border-radius:13px;background:var(--navy);color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.secondary{border:2px solid var(--line);border-radius:13px;background:#fff;color:var(--navy);padding:10px 16px;font-weight:800;cursor:pointer}.tip{margin-top:20px;padding:15px 17px;background:#fff8df;border-left:6px solid var(--yellow);border-radius:12px;line-height:1.5}.progress{height:12px;background:#e5edf1;border-radius:999px;overflow:hidden;margin-bottom:22px}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .25s}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
@media(max-width:650px){.hero{grid-template-columns:1fr;text-align:center}.icon{margin:auto}.stat{min-width:calc(50% - 10px)}}
</style></head><body><main class="page"><nav class="top"><a class="back" href="../index.html">← Tilbage til øvelserne</a><button class="pill" id="sound" type="button" aria-pressed="true">🔊 Lyd til</button></nav><section class="hero"><div class="icon" aria-hidden="true">⚡</div><div><h1>Smarte genveje</h1><p>Øv genvejstaster i konkrete situationer fra dokumenter og tekstbehandling.</p></div></section><section class="card"><div class="stats"><div class="stat"><span>Opgave</span><strong id="number">1 af 8</strong></div><div class="stat"><span>Rigtige</span><strong id="score">0</strong></div></div><div class="progress"><div id="bar" style="width:0"></div></div><div class="scenario"><span id="sceneIcon">📄</span><h2 id="title">Kopiér tekst</h2><p id="situation"></p><div class="sample" id="sample"></div><p><strong>Tryk på den rigtige tastekombination.</strong></p></div><p class="feedback" id="feedback" aria-live="polite">Du får et tip efter tre forsøg.</p><div class="actions"><button class="secondary" id="skip">Ny opgave</button><button class="secondary" id="restart">Start forfra</button></div><div class="tip"><strong>Tip:</strong> Hold Ctrl nede, mens du trykker på bogstavet.</div><style>.scenario{max-width:700px;margin:auto;background:#f7fbfd;border:2px solid var(--line);border-radius:18px;padding:24px;text-align:center}.scenario>span{font-size:46px}.scenario h2{margin:8px 0}.sample{background:#fff;border:2px solid #9fbac7;border-radius:10px;padding:14px;margin:15px auto;max-width:500px;text-align:left}.marked{background:#cfe8f5;padding:2px}</style></section></main><script>
let soundOn=true;const snd=document.querySelector('#sound');snd.addEventListener('click',()=>{soundOn=!soundOn;snd.textContent=soundOn?'🔊 Lyd til':'🔇 Lyd fra';snd.setAttribute('aria-pressed',soundOn)});function tone(f=520){if(!soundOn)return;try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);o.stop(c.currentTime+.09)}catch(e){}}

const tasks=[{t:'Kopiér tekst',s:'Du vil kopiere den markerede tekst.',x:'Mit navn er <span class="marked">Anna Jensen</span>.',k:'c',h:'Ctrl + C'},{t:'Indsæt tekst',s:'Du har kopieret en adresse og vil sætte den ind.',x:'Adresse: │',k:'v',h:'Ctrl + V'},{t:'Klip tekst',s:'Du vil flytte den markerede tekst et andet sted hen.',x:'Jeg bor i <span class="marked">Aarhus</span>.',k:'x',h:'Ctrl + X'},{t:'Fortryd',s:'Du kom til at slette en sætning og vil have den tilbage.',x:'Dokumentet mangler en sætning.',k:'z',h:'Ctrl + Z'},{t:'Markér alt',s:'Du vil markere hele dokumentet.',x:'Dette dokument har flere linjer med tekst.',k:'a',h:'Ctrl + A'},{t:'Find',s:'Du vil finde ordet “computer” i dokumentet.',x:'Et langt dokument med mange ord …',k:'f',h:'Ctrl + F'},{t:'Fed skrift',s:'Du vil gøre den markerede overskrift fed.',x:'<span class="marked">Min ansøgning</span>',k:'b',h:'Ctrl + B'},{t:'Kursiv',s:'Du vil gøre den markerede tekst kursiv.',x:'<span class="marked">Vigtigt</span>',k:'i',h:'Ctrl + I'}];let index=0,score=0,fails=0;const fb=document.querySelector('#feedback');function show(){const q=tasks[index];document.querySelector('#number').textContent=`${index+1} af ${tasks.length}`;document.querySelector('#title').textContent=q.t;document.querySelector('#situation').textContent=q.s;document.querySelector('#sample').innerHTML=q.x;document.querySelector('#bar').style.width=`${index/tasks.length*100}%`;fails=0}document.addEventListener('keydown',e=>{if(['Control','Shift','Alt','Meta'].includes(e.key))return;e.preventDefault();const q=tasks[index];if(e.ctrlKey&&e.key.toLowerCase()===q.k){score++;tone();fb.textContent=`Rigtigt: ${q.h}`;fb.className='feedback ok';document.querySelector('#score').textContent=score;index++;if(index>=tasks.length){document.querySelector('.scenario').innerHTML='<span style="font-size:64px">✅</span><h2>Du har gennemført øvelsen</h2><p>Flot! Du har trænet de vigtigste genvejstaster.</p>';document.querySelector('#bar').style.width='100%'}else setTimeout(show,500)}else{fails++;tone(220);fb.textContent=fails>=3?`Tip: ${q.h}`:'Ikke helt. Prøv igen.';fb.className='feedback help'}});document.querySelector('#skip').onclick=()=>{index=(index+1)%tasks.length;fb.textContent='Ny opgave.';fb.className='feedback';show()};document.querySelector('#restart').onclick=()=>location.reload();show();</script></body></html>
